name: Build CRIMEDISA RAPPORT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o CRIMEDISA_RAPPORT_phone_build.zip
          ls -la crimedisa_rapport

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: crimedisa_rapport
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIMEDISA-RAPPORT-APK
          path: crimedisa_rapport/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
